<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenTag – BLE Tracker</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121821;
      --panel-2: #19212c;
      --text: #eef2f7;
      --muted: #9aa7b5;
      --border: #273241;
      --accent: #6ea8fe;
      --ok: #56d364;
      --warn: #e3b341;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header { margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); }
    .subtitle { color: var(--muted); margin: 0; }

    .mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
      margin: 0;
    }
    .mode-toggle-label {
      font-size: 13px;
      font-weight: 700;
      min-width: 72px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #374151;
      border-radius: 999px;
      transition: .15s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 4px;
      top: 4px;
      border-radius: 50%;
      background: #fff;
      transition: .15s;
    }
    .switch input:checked + .slider {
      background: #d4a900;
    }
    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }
    .switch input:disabled + .slider {
      opacity: .45;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button, input {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 11px 15px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #08111f; border-color: var(--accent); font-weight: 700; }
    button.secondary { background: transparent; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .panel h2 { font-size: 17px; margin: 0 0 14px; }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 12px;
      background: var(--panel-2);
    }

    .dot {
      width: 11px; height: 11px; border-radius: 999px; background: #f85149;
      box-shadow: 0 0 0 4px rgba(248,81,73,.12);
      flex: 0 0 auto;
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(86,211,100,.12); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(227,179,65,.12); }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0 18px;
    }

    .metric {
      background: var(--panel-2);
      border-radius: 12px;
      padding: 12px;
      min-height: 80px;
    }
    .metric .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .metric .value { font-weight: 700; font-size: 20px; }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin: 12px 0 6px;
    }
    input { width: 100%; padding: 10px 12px; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 12px;
    }

    #map {
      min-height: 610px;
      height: calc(100vh - 250px);
      max-height: 760px;
      border-radius: 14px;
      overflow: hidden;
      background: #dfe7ef;
    }

    .log {
      margin-top: 18px;
      max-height: 170px;
      overflow: auto;
      background: #0a0d12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
    }

    .map-legend {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      #map { min-height: 460px; height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>OpenTag Tracker</h1>
      <p class="subtitle">XIAO nRF52840 BLE prototipe tracker.</p>
    </header>

    <div class="toolbar">
      <button id="connectBtn" class="primary">Search Tracker</button>
      <button id="disconnectBtn" class="secondary" disabled>Stop Tracking</button>
      <label class="mode-toggle">
        <span class="mode-toggle-label" id="modeLabel">Normal</span>
        <span class="switch">
          <input id="modeToggle" type="checkbox" disabled>
          <span class="slider"></span>
        </span>
      </label>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="status">
          <span id="statusDot" class="dot"></span>
          <div>
            <strong id="statusText">No tracker selected</strong>
            <div id="statusSub" class="hint" style="margin-top:2px">Waiting for BLE device.</div>
          </div>
        </div>

        <h2>Tracker data</h2>
        <div class="metric-grid">
          <div class="metric"><div class="label">Name</div><div class="value" id="deviceName">–</div></div>
          <div class="metric"><div class="label">RSSI</div><div class="value" id="rssi">–</div></div>
          <div class="metric"><div class="label">Estimated Distance</div><div class="value" id="distance">–</div></div>
          <div class="metric"><div class="label">Transmission Power</div><div class="value" id="txPower">–</div></div>
          <div class="metric"><div class="label">Last BLE Packet</div><div class="value" id="lastSeen">–</div></div>
          <div class="metric"><div class="label">Own GPS Accuracy</div><div class="value" id="accuracy">–</div></div>
          <div class="metric"><div class="label">Tracker mode</div><div class="value" id="trackerMode">–</div></div>
        </div>

        <div class="map-legend">
          <span class="pill">🔵 Own Position</span>
          <span class="pill">🟡 Tracker: BLE Distance</span>
          <span class="pill" id="backendPill">⚪ Shared backend: connecting…</span>
        </div>

        <div id="log" class="log"></div>
      </section>

      <section class="panel" style="padding: 10px">
        <div id="map"></div>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script>
    const TRACKER_NAME = "OpenTag-Test";
    const CONTROL_SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const MODE_CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    const $ = (id) => document.getElementById(id);
    let device = null;
    let locationWatchId = null;
    let myMarker = null;
    let accuracyCircle = null;
    let myPosition = null;
    let trackerDistanceCircle = null;
    const CAL_TX_POWER = 4;
    const LOST_TX_POWER = 8;

    const CAL_RSSI_1M = -59;
    const PATH_LOSS_EXPONENT = 2.0;
    const RSSI_WINDOW_MS = 8000;
    const STALE_MS = 6000;
    const UI_THROTTLE_MS = 250;

    let rssiSamples = [];
    let smoothRaw = NaN;
    let smoothNorm = NaN;
    let lastTxPower = NaN;
    let trackerMode = null;

    let sharedSocket = null;
    let sharedReconnectTimer = null;
    let sharedReconnectDelay = 1000;
    let sharedClientId = null;
    let sharedEverOpened = false;

    (function rememberAccessToken() {
      const params = new URLSearchParams(location.search);
      if (!params.has("token")) return;
      try { localStorage.setItem("opentagToken", params.get("token")); } catch (_) {}
      params.delete("token");
      const query = params.toString();
      history.replaceState(null, "", location.pathname + (query ? `?${query}` : "") + location.hash);
    })();
    const accessToken = (() => {
      try { return localStorage.getItem("opentagToken") || ""; } catch (_) { return ""; }
    })();
    const sharedMarkers = new Map();
    const sharedAccuracyCircles = new Map();
    const SHARED_REPORT_INTERVAL_MS = 1000;
    const SHARED_STALE_MS = 15000;

    let myAccuracy = null;
    let lastSharedReportAt = 0;

    let tracking = false;
    let busy = false;
    let receiving = false;
    let firstFix = true;
    let lastUiUpdate = 0;

    let advertisementController = null;
    let advertisementWatching = false;
    let advertisementListenerAttached = false;
    let recoveryTimer = null;
    let lastAdvertisementAt = 0;

    const map = L.map("map").setView([47.4979, 19.0402], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap közreműködők'
    }).addTo(map);

    function backendWebSocketUrl() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const query = accessToken ? `?token=${encodeURIComponent(accessToken)}` : "";
      return `${protocol}//${location.host}/ws/${query}`;
    }

    function setBackendPill(text, state = "neutral") {
      const el = $("backendPill");
      if (!el) return;
      const prefix = state === "ok" ? "🟢" : state === "warn" ? "🟡" : "⚪";
      el.textContent = `${prefix} Shared backend: ${text}`;
    }

    const sharedStates = new Map();
    let serverOffsetMs = 0; // server clock minus local clock, so "age" is right even if the phone clock is off
    const serverNow = () => Date.now() + serverOffsetMs;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function formatAge(ms) {
      const sec = Math.max(0, Math.round(ms / 1000));
      if (sec < 60) return `${sec} s`;
      const min = Math.round(sec / 60);
      if (min < 60) return `${min} min`;
      const h = Math.floor(min / 60);
      if (h < 24) return `${h} h ${min % 60} min`;
      return `${Math.floor(h / 24)} d ${h % 24} h`;
    }

    function sharedStateIsLive(state) {
      return state.live !== false && serverNow() - (state.updatedAt || 0) <= SHARED_STALE_MS;
    }

    function sharedPopupHtml(trackerId) {
      const state = sharedStates.get(trackerId);
      if (!state) return "";
      const live = sharedStateIsLive(state);
      const updated = new Date(state.updatedAt || serverNow());
      const accuracy = Number(state.location?.accuracy);
      const rows = [
        `<strong>${escapeHtml(state.trackerName || state.trackerId)}</strong>`,
        live ? "Tracker in range – live position" : "Last known position (tracker not in range)",
        `Last report: ${updated.toLocaleString("hu-HU")} (${formatAge(serverNow() - updated.getTime())} ago)`
      ];
      if (live) {
        rows.push(`RSSI: ${Number.isFinite(state.rssi) ? `${Math.round(state.rssi)} dBm` : "–"}`);
        rows.push(`Estimated distance from reporter: ${Number.isFinite(state.distanceM) ? formatDistance(state.distanceM) : "–"}`);
      }
      rows.push(`Reporter GPS accuracy: ${Number.isFinite(accuracy) ? `${Math.round(accuracy)} m` : "–"}`);
      rows.push(`Mode: ${escapeHtml((state.mode || "normal").toUpperCase())}`);
      return rows.join("<br>");
    }

    function styleSharedMarker(trackerId) {
      const state = sharedStates.get(trackerId);
      const marker = sharedMarkers.get(trackerId);
      if (!state || !marker) return;
      const live = sharedStateIsLive(state);
      marker.setStyle({ fillOpacity: live ? 1 : 0.5, opacity: live ? 1 : 0.7 });
      const circle = sharedAccuracyCircles.get(trackerId);
      if (circle) circle.setStyle({ fillOpacity: live ? 0.10 : 0.04, opacity: live ? 1 : 0.5 });
    }

    function renderSharedTrackerState(state) {
      if (!state || !state.trackerId || !state.location) return;

      const id = state.trackerId;
      sharedStates.set(id, state);
      const latLng = [state.location.lat, state.location.lng];

      let marker = sharedMarkers.get(id);
      if (!marker) {
        marker = L.circleMarker(latLng, {
          radius: 7, color: "#111827", weight: 2,
          fillColor: "#facc15", fillOpacity: 1, pane: "markerPane"
        }).addTo(map);
        marker.bindPopup(() => sharedPopupHtml(id));
        sharedMarkers.set(id, marker);
      } else {
        marker.setLatLng(latLng);
      }

      const accuracy = Number(state.location.accuracy);
      let circle = sharedAccuracyCircles.get(id);
      if (Number.isFinite(accuracy) && accuracy > 0) {
        if (!circle) {
          circle = L.circle(latLng, {
            radius: accuracy, color: "#facc15", fillColor: "#facc15", fillOpacity: 0.10, weight: 1
          }).addTo(map);
          sharedAccuracyCircles.set(id, circle);
        } else {
          circle.setLatLng(latLng);
          circle.setRadius(accuracy);
        }
      } else if (circle) {
        map.removeLayer(circle);
        sharedAccuracyCircles.delete(id);
      }
      styleSharedMarker(id);
    }

    function markSharedTrackerOffline(trackerId, reason = "removed") {
      const state = sharedStates.get(trackerId);
      if (state) {
        state.live = false;
        styleSharedMarker(trackerId);
      }
      log(`Tracker not live any more: ${trackerId} (${reason}). Showing its last known position.`);
    }

    function handleSharedBackendMessage(message) {
      if (!message || typeof message !== "object") return;

      if (message.type === "helloAck") {
        if (typeof message.clientId === "string" && message.clientId) sharedClientId = message.clientId;
        if (Number.isFinite(message.serverTime)) serverOffsetMs = message.serverTime - Date.now();
        return;
      }

      if (message.type === "snapshot") {
        if (Number.isFinite(message.serverTime)) serverOffsetMs = message.serverTime - Date.now();
        for (const state of message.lastKnown || []) renderSharedTrackerState({ ...state, live: false });
        for (const state of message.trackers || []) renderSharedTrackerState({ ...state, live: true });
        setBackendPill("connected", "ok");
        return;
      }

      if (message.type === "trackerState") {
        renderSharedTrackerState(message.state);
        return;
      }

      if (message.type === "trackerRemoved") {
        markSharedTrackerOffline(message.trackerId, message.reason || "removed");
        return;
      }

      if (message.type === "error") {
        log(`Backend error: ${message.message || "unknown error"}`);
      }
    }

    function scheduleSharedReconnect() {
      if (sharedReconnectTimer) return;
      sharedReconnectTimer = setTimeout(() => {
        sharedReconnectTimer = null;
        connectSharedBackend();
      }, sharedReconnectDelay);
      sharedReconnectDelay = Math.min(sharedReconnectDelay * 2, 15000);
    }

    function connectSharedBackend() {
      if (sharedSocket && (sharedSocket.readyState === WebSocket.OPEN || sharedSocket.readyState === WebSocket.CONNECTING)) {
        return;
      }
      if (!window.WebSocket) {
        setBackendPill("browser WebSocket unavailable", "warn");
        return;
      }

      setBackendPill("connecting…", "neutral");
      try {
        sharedSocket = new WebSocket(backendWebSocketUrl());

        sharedSocket.addEventListener("open", () => {
          sharedReconnectDelay = 1000;
          sharedEverOpened = true;
          setBackendPill("connected", "ok");
          log("Shared backend connected.");
          sharedSocket.send(JSON.stringify({
            type: "hello",
            appVersion: "phase1"
          }));
        });

        sharedSocket.addEventListener("message", (event) => {
          try {
            handleSharedBackendMessage(JSON.parse(event.data));
          } catch (error) {
            log(`Backend message parse error: ${error.message}`);
          }
        });

        sharedSocket.addEventListener("close", () => {
          setBackendPill(
            sharedEverOpened ? "disconnected; retrying…" : "cannot connect (access code? proxy?); retrying…",
            "warn"
          );
          scheduleSharedReconnect();
        });

        sharedSocket.addEventListener("error", () => {
          setBackendPill("connection error", "warn");
        });
      } catch (error) {
        setBackendPill("connection error", "warn");
        log(`Shared backend connection failed: ${error.message}`);
        scheduleSharedReconnect();
      }
    }

    function sendSharedMessage(message) {
      if (!sharedSocket || sharedSocket.readyState !== WebSocket.OPEN) return false;
      try {
        sharedSocket.send(JSON.stringify(message));
        return true;
      } catch (error) {
        log(`Shared backend send error: ${error.message}`);
        return false;
      }
    }

    function sendTrackerReport(force = false) {
      if (!tracking || !device || !receiving) return;

      const now = Date.now();
      if (!force && now - lastSharedReportAt < SHARED_REPORT_INTERVAL_MS) return;
      if (now - lastAdvertisementAt > STALE_MS) return;

      const distanceM = estimateDistance(smoothNorm);
      const sent = sendSharedMessage({
        type: "trackerReport",
        trackerId: TRACKER_NAME,
        trackerName: device.name || TRACKER_NAME,
        location: myPosition ? {
          lat: myPosition[0],
          lng: myPosition[1],
          accuracy: Number.isFinite(myAccuracy) ? myAccuracy : null
        } : null,
        rssi: Number.isFinite(smoothRaw) ? smoothRaw : null,
        txPower: Number.isFinite(lastTxPower) ? lastTxPower : null,
        distanceM: Number.isFinite(distanceM) ? distanceM : null,
        mode: trackerMode === "lost" ? "lost" : "normal",
        lastBlePacketAt: lastAdvertisementAt
      });

      if (sent) lastSharedReportAt = now;
    }

    function sendTrackerStop(trackerId = TRACKER_NAME) {
      sendSharedMessage({
        type: "trackerStop",
        trackerId
      });
    }

    function startSharedReportTimer() {
      setInterval(() => {
        sendTrackerReport(false);
        for (const trackerId of sharedStates.keys()) styleSharedMarker(trackerId);
        if (!(tracking && receiving)) clearDistanceCircle();
      }, SHARED_REPORT_INTERVAL_MS);
    }

    function log(message) {
      const stamp = new Date().toLocaleTimeString("hu-HU");
      $("log").textContent += `[${stamp}] ${message}\n`;
      $("log").scrollTop = $("log").scrollHeight;
    }

    function setStatus(text, sub = "", type = "") {
      $("statusText").textContent = text;
      $("statusSub").textContent = sub;
      $("statusDot").className = `dot ${type}`.trim();
    }

    function setConnectedUI(connected) {
      $("disconnectBtn").disabled = !connected;
      $("connectBtn").disabled = connected;
      $("modeToggle").disabled = !connected;
      if (!connected) {
        $("modeToggle").checked = false;
        $("modeLabel").textContent = "Normal";
      }
    }

    function setTrackerMode(mode) {
      trackerMode = mode;

      const modeElement = $("trackerMode");
      if (modeElement) {
        modeElement.textContent =
          mode === "lost" ? "LOST" :
          mode === "normal" ? "NORMAL" : "–";
      }

      if (mode) {
        $("modeToggle").checked = mode === "lost";
        $("modeLabel").textContent = mode === "lost" ? "Lost" : "Normal";
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function formatDistance(m) {
      if (!Number.isFinite(m)) return "–";
      if (m < 1) return `${Math.round(m * 100)} cm`;
      if (m < 10) return `${m.toFixed(1)} m`;
      return `${m.toFixed(0)} m`;
    }

    function estimateDistance(rssi) {
      if (!Number.isFinite(rssi) || PATH_LOSS_EXPONENT <= 0) return NaN;
      return Math.pow(
        10,
        (CAL_RSSI_1M - rssi) / (10 * PATH_LOSS_EXPONENT)
      );
    }

    function median(values) {
      const a = [...values].sort((x, y) => x - y);
      const m = a.length >> 1;
      return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
    }

    function resetSignalState() {
      rssiSamples = [];
      smoothRaw = smoothNorm = lastTxPower = NaN;
      receiving = false;
      $("lastSeen").textContent = "–";
    }

    function addRssiSample(rssi) {
      const tx = Number.isFinite(lastTxPower) ? lastTxPower : (trackerMode === "lost" ? LOST_TX_POWER : CAL_TX_POWER);
      const now = Date.now();
      rssiSamples.push({ t: now, r: rssi, v: rssi - (tx - CAL_TX_POWER) });
      while (rssiSamples.length > 25 || (rssiSamples.length && now - rssiSamples[0].t > RSSI_WINDOW_MS)) {
        rssiSamples.shift();
      }
      smoothRaw = median(rssiSamples.map(x => x.r));
      smoothNorm = median(rssiSamples.map(x => x.v));
    }

    function refreshReadouts() {
      const d = estimateDistance(smoothNorm);
      $("rssi").textContent = Number.isFinite(smoothRaw) ? `${Math.round(smoothRaw)} dBm` : "–";
      $("distance").textContent = Number.isFinite(d) ? formatDistance(d) : "–";
      updateTrackerMarker(d);
    }

    function clearDistanceCircle() {
      if (trackerDistanceCircle) map.removeLayer(trackerDistanceCircle);
      trackerDistanceCircle = null;
    }

    function updateTrackerMarker(d = estimateDistance(smoothNorm)) {
      if (!tracking || !receiving || !myPosition) {
        clearDistanceCircle();
        return;
      }
      const hasD = Number.isFinite(d);
      renderSharedTrackerState({
        trackerId: TRACKER_NAME,
        trackerName: device?.name || TRACKER_NAME,
        location: {
          lat: myPosition[0],
          lng: myPosition[1],
          accuracy: Number.isFinite(myAccuracy) ? myAccuracy : null
        },
        rssi: Number.isFinite(smoothRaw) ? smoothRaw : null,
        distanceM: hasD ? d : null,
        mode: trackerMode === "lost" ? "lost" : "normal",
        updatedAt: serverNow(),
        live: true
      });

      if (!hasD) {
        clearDistanceCircle();
        return;
      }
      const radius = Math.max(3, Math.min(d, 100));
      const circleText = `BLE tracker estimated distance: ${formatDistance(d)}<br>` +
        `It's not a real GPS position; only an RSSI-based estimation.`;

      if (!trackerDistanceCircle) {
        trackerDistanceCircle = L.circle(myPosition, {
          radius, color: "#facc15", fillColor: "#facc15",
          fillOpacity: 0.10, weight: 2, dashArray: "6 6"
        }).bindPopup(circleText).addTo(map);
      } else {
        trackerDistanceCircle.setLatLng(myPosition);
        trackerDistanceCircle.setRadius(radius);
        trackerDistanceCircle.getPopup().setContent(circleText);
      }
    }

    function updateLocationMarker(position) {
      const { latitude, longitude, accuracy } = position.coords;
      myPosition = [latitude, longitude];
      myAccuracy = accuracy;

      if (!myMarker) {
        myMarker = L.circleMarker(myPosition, {
          radius: 8,
          color: "#2f81f7",
          fillColor: "#2f81f7",
          fillOpacity: 0.9,
          weight: 2
        }).addTo(map);
      } else {
        myMarker.setLatLng(myPosition);
      }
      myMarker.bindPopup(`This device<br>Accuracy: ${Math.round(accuracy)} m`);

      if (!accuracyCircle) {
        accuracyCircle = L.circle(myPosition, {
          radius: accuracy,
          color: "#2f81f7",
          fillOpacity: 0.05,
          weight: 1
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(myPosition);
        accuracyCircle.setRadius(accuracy);
      }

      $("accuracy").textContent = `${Math.round(accuracy)} m`;
      if (firstFix) {
        firstFix = false;
        map.setView(myPosition, Math.max(map.getZoom(), 15));
      }
      updateTrackerMarker();
    }

    function startLocation() {
      if (locationWatchId !== null) return;
      if (!navigator.geolocation) {
        log("Browser does not support geolocation API.");
        return;
      }
      locationWatchId = navigator.geolocation.watchPosition(
        updateLocationMarker,
        (error) => log(`Location error: ${error.message}`),
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
      log("Location service started automatically.");
    }

    async function startAdvertisements() {
      if (!tracking || !device) return false;
      if (typeof device.watchAdvertisements !== "function") {
        setStatus("BLE not available", "Browser does not support BLE listening.", "warn");
        return false;
      }

      try {
        if (!advertisementListenerAttached) {
          device.addEventListener("advertisementreceived", onAdvertisement);
          advertisementListenerAttached = true;
        }

        if (advertisementController) {
          try { advertisementController.abort(); } catch (_) {}
        }
        advertisementController = new AbortController();
        await device.watchAdvertisements({ signal: advertisementController.signal });

        advertisementWatching = true;
        log("Listening for BLE advertising is active.");
        return true;
      } catch (error) {
        advertisementWatching = false;
        if (error?.name === "AbortError") return false;
        log(`Listening for advertising error: ${error.message}`);
        setStatus("BLE listening error", "Listening did not start.", "warn");
        return false;
      }
    }

    async function recoverAdvertisements() {
      if (!tracking || busy) return;

      const age = Date.now() - lastAdvertisementAt;
      if (age < 5000 && advertisementWatching) return;

      if (age >= STALE_MS && receiving) {
        receiving = false;
        setStatus("No fresh packet", "No BLE packet – restarting the listening task.", "warn");
      }
      await startAdvertisements();
    }

    function startRecoveryTimer() {
      if (recoveryTimer) clearInterval(recoveryTimer);
      recoveryTimer = setInterval(recoverAdvertisements, 5000);
    }

    function onAdvertisement(event) {
      if (!tracking) return;
      const rssi = Number(event.rssi);
      const now = Date.now();
      lastAdvertisementAt = now;
      advertisementWatching = true;

      if (typeof event.txPower === "number" && Number.isFinite(event.txPower)) {
        lastTxPower = event.txPower;
      }
      if (Number.isFinite(rssi)) addRssiSample(rssi);

      if (now - lastUiUpdate < UI_THROTTLE_MS && receiving) return;
      lastUiUpdate = now;

      $("lastSeen").textContent = new Date(now).toLocaleTimeString("hu-HU");
      if (Number.isFinite(lastTxPower)) $("txPower").textContent = `${lastTxPower} dBm`;
      if (Number.isFinite(rssi)) refreshReadouts();

      if (!receiving) {
        receiving = true;
        updateTrackerMarker();
        setStatus("Tracker found", Number.isFinite(rssi) ? "Advertising packet arrived." : "Advertising packet arrived, without RSSI.", "ok");
      }
    }

    async function connectTracker() {
      if (!navigator.bluetooth) {
        setStatus("Web Bluetooth not supported", "Try a Chromium-based browser with HTTPS or localhost.", "danger");
        log("navigator.bluetooth not available.");
        return;
      }

      try {
        log(`Searching BLE device: ${TRACKER_NAME}`);
        device = await navigator.bluetooth.requestDevice({
          filters: [{ name: TRACKER_NAME }],
          optionalServices: [CONTROL_SERVICE_UUID]
        });

        $("deviceName").textContent = device.name || TRACKER_NAME;
        resetSignalState();
        tracking = true;
        lastAdvertisementAt = Date.now();
        setTrackerMode(null);

        setConnectedUI(true);
        setStatus("Tracker selected", "Reading current tracker mode…", "ok");
        log("Reading the tracker's current mode over GATT.");

        try {
          await readCurrentMode();
        } catch (modeError) {
          log(`Current mode read failed: ${modeError.message}`);
          setTrackerMode("normal");
          setStatus(
            "Tracker selected",
            "Current mode could not be read; starting advertising.",
            "warn"
          );
        }

        if (tracking) {
          await startAdvertisements();
          startRecoveryTimer();
        }

        if (!myPosition && !locationWatchId) {
          startLocation();
        }
      } catch (error) {
        if (error && error.name === "NotFoundError") {
          log("User didn't chose a tracker.");
          return;
        }
        log(`BLE error: ${error.message}`);
        setStatus("BLE error", error.message, "");
      }
    }


    async function readCurrentMode() {
      if (!device?.gatt) {
        throw new Error("Tracker GATT interface unavailable.");
      }

      const step = async (name, promise, ms = 10000) => {
        log(`GATT: ${name}…`);
        let timer;
        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error(`Timeout: ${name}`)), ms);
        });
        try {
          return await Promise.race([promise, timeout]);
        } finally {
          clearTimeout(timer);
        }
      };

      const server = await step(
        "connecting to read current mode",
        device.gatt.connect(),
        20000
      );

      try {
        const service = await step(
          "current mode service search",
          server.getPrimaryService(CONTROL_SERVICE_UUID),
          10000
        );

        const characteristic = await step(
          "current mode characteristic search",
          service.getCharacteristic(MODE_CHARACTERISTIC_UUID),
          10000
        );

        const value = (
          await step("current mode read", characteristic.readValue(), 10000)
        ).getUint8(0);

        if (value === 0) {
          setTrackerMode("normal");
          log("Current tracker mode: NORMAL (0)");
        } else if (value === 1) {
          setTrackerMode("lost");
          log("Current tracker mode: LOST (1)");
        } else {
          throw new Error(`Unknown tracker mode value: ${value}`);
        }
      } finally {
        try {
          if (device?.gatt?.connected) {
            device.gatt.disconnect();
          }
        } catch (_) {}
      }

      await sleep(350);
    }

    function syncModeToggle() {
      $("modeToggle").checked = trackerMode === "lost";
      $("modeLabel").textContent = trackerMode === "lost" ? "Lost" : "Normal";
    }

    async function setRemoteMode(mode) {
      const dev = device;
      if (!tracking || !dev?.gatt || busy) {
        if (!dev?.gatt) setStatus("No tracker", "Fist connect to OpenTag.", "warn");
        syncModeToggle();
        return;
      }

      const value = mode === "lost" ? 1 : 0;
      const label = mode === "lost" ? "LOST" : "NORMAL";

      busy = true;
      $("modeToggle").disabled = true;
      setStatus("GATT connection", `Sending ${label} mode…`, "warn");

      try {
        if (advertisementController) advertisementController.abort();
        advertisementController = null;
        advertisementWatching = false;

        await sleep(400);

        const step = async (name, promise, ms = 10000) => {
          log(`GATT: ${name}…`);
          let timer;
          const timeout = new Promise((_, rej) => {
            timer = setTimeout(() => rej(new Error(`Timeout: ${name}`)), ms);
          });
          try { return await Promise.race([promise, timeout]); }
          finally { clearTimeout(timer); }
        };

        const server = await step("connecting", dev.gatt.connect(), 20000);
        const service = await step("service search", server.getPrimaryService(CONTROL_SERVICE_UUID), 20000);
        const characteristic = await step("characteristic search", service.getCharacteristic(MODE_CHARACTERISTIC_UUID));

        await step("write", characteristic.writeValueWithResponse(new Uint8Array([value])));
        log(`GATT write successful: ${value}`);

        await sleep(80);
        const actual = (await step("readback", characteristic.readValue())).getUint8(0);
        log(`GATT readback: ${actual}`);
        if (actual !== value) {
          throw new Error(`Tracker has not responded to  mode change (waited ${value}, received ${actual}).`);
        }

        setTrackerMode(mode);
        resetSignalState();
        setStatus("Mode change complete", `${label} mode active.`, "ok");
      } catch (error) {
        syncModeToggle();
        log(`GATT mode change error: ${error.name || "Error"}: ${error.message}`);
        setStatus("GATT error", error.message, "warn");
      } finally {
        try { if (dev.gatt?.connected) dev.gatt.disconnect(); } catch (_) {}
        busy = false;
        $("modeToggle").disabled = !tracking;
        if (tracking) {
          await sleep(350);
          lastAdvertisementAt = Date.now();
          await startAdvertisements();
        }
      }
    }

    function disconnectTracker() {
      if (tracking) sendTrackerStop(TRACKER_NAME);
      tracking = false;
      if (recoveryTimer) { clearInterval(recoveryTimer); recoveryTimer = null; }
      if (advertisementController) {
        try { advertisementController.abort(); } catch (_) {}
        advertisementController = null;
      }
      advertisementWatching = false;
      lastAdvertisementAt = 0;

      if (device) {
        if (advertisementListenerAttached) {
          try { device.removeEventListener("advertisementreceived", onAdvertisement); } catch (_) {}
        }
        advertisementListenerAttached = false;
        try { if (device.gatt?.connected) device.gatt.disconnect(); } catch (_) {}
      }
      device = null;

      resetSignalState();
      setTrackerMode(null);
      setConnectedUI(false);
      setStatus("No tracker connected", "Waiting for BLE devices.", "");
      for (const id of ["deviceName", "rssi", "distance", "txPower"]) $(id).textContent = "–";

      clearDistanceCircle();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && tracking && !busy) startAdvertisements();
    });

    $("connectBtn").addEventListener("click", connectTracker);
    $("disconnectBtn").addEventListener("click", disconnectTracker);
    $("modeToggle").addEventListener("change", (event) => {
      const mode = event.target.checked ? "lost" : "normal";
      log(`Webapp: modeswitch request → ${mode === "lost" ? "LOST" : "NORMAL"}`);
      setRemoteMode(mode);
    });

    log(`Required name of tracker: ${TRACKER_NAME}`);
    connectSharedBackend();
    startSharedReportTimer();

    window.addEventListener("beforeunload", () => {
      if (tracking) sendTrackerStop(TRACKER_NAME);
      try { sharedSocket?.close(); } catch (_) {}
    });

    startLocation();
  </script>
</body>
</html>
