# Expected backend files: /mnt/Cache/Apps/nginxpmplus/opentag/backend/server.js and package.json
services:
  opentag-backend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WS_PATH: /ws
      TRACKER_TTL_MS: 15000
      REGISTRATION_ENABLED: "true"
      AUTH_FILE: /data/auth.json
      DATA_FILE: /data/lastknown.json
    ports:
      - "192.168.1.101:3000:3000"
    volumes:
      - /mnt/Cache/Apps/nginxpmplus/opentag/backend:/app:ro
      - /mnt/Cache/Apps/nginxpmplus/opentag-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
